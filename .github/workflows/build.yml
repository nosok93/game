name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev cmake
          pip install --upgrade pip buildozer cython==0.29.33
      - name: Build APK
        run: |
          buildozer init
          sed -i 's/title = My Application/title = RW Script Kurs/' buildozer.spec
          sed -i 's/package.name = myapp/package.name = rwscript/' buildozer.spec
          sed -i 's/# requirements = python3/requirements = python3,kivy/' buildozer.spec
          sed -i 's/# orientation = portrait/orientation = portrait/' buildozer.spec
          buildozer android debug
        timeout-minutes: 60
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rw-script-apk
          path: bin/*.apk
