name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip ccache \
            openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libffi-dev libssl-dev libbz2-dev libsqlite3-dev \
            liblzma-dev libreadline-dev uuid-dev libgdbm-dev \
            cmake libgl1-mesa-dev
          sudo apt-get clean

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Prepare buildozer.spec
        run: |
          buildozer init
          # Основные параметры
          sed -i 's/^title = .*/title = RW Script Kurs/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = rwscript/' buildozer.spec
          # ВАЖНО: фиксируем Python 3.11.12 (не 3.14!)
          sed -i 's/^#*requirements = .*/requirements = python3==3.11.12,kivy/' buildozer.spec
          sed -i 's/^#*orientation = .*/orientation = portrait/' buildozer.spec
          # Только одна архитектура — arm64-v8a
          sed -i 's/^#*android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          # Фиксируем версию pip (чтобы не падал на Python 3.14 внутри сборки)
          sed -i 's/^#*p4a.pip_version = .*/p4a.pip_version = 24.0/' buildozer.spec
          # Разрешения
          sed -i 's/^#*android.permissions = .*/android.permissions = INTERNET/' buildozer.spec

      - name: Build APK
        run: yes | buildozer -v android debug
        timeout-minutes: 90

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rw-script-apk
          path: bin/*.apk
